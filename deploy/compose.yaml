services:
  nginx-gateway:
    image: docker.io/library/nginx:stable-alpine
    depends_on:
      - ftth-app-1
      - ftth-app-2
      - static-site
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - public_net
      - app_net
    restart: unless-stopped

  ftth-app-1:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment: &application_environment
      PORT: "8080"
      DATABASE_URL: "postgres://ftth_app:${POSTGRES_PASSWORD}@postgres:5432/ftth?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
      - session_net
      - database_net
    restart: unless-stopped

  ftth-app-2:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment: *application_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
      - session_net
      - database_net
    restart: unless-stopped

  static-site:
    image: docker.io/library/nginx:stable-alpine
    volumes:
      - ./static-site:/usr/share/nginx/html:ro,Z
    networks:
      - public_net
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    # También se expone al healthcheck; el comando de Redis ya recibe esta
    # clave durante la interpolación de Compose.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data:Z
    networks:
      - session_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ftth
      POSTGRES_USER: ftth_app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      # PostgreSQL ejecuta scripts ordenados sólo al crear un volumen vacío.
      - ../database/migrations/001_schema_up.sql:/docker-entrypoint-initdb.d/001_schema_up.sql:ro,Z
      - ../database/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro,Z
    networks:
      - database_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  # Sólo la puerta de enlace publica puertos al host.
  public_net:
  # Estas redes no tienen acceso directo desde el host ni entre capas ajenas.
  app_net:
    internal: true
  session_net:
    internal: true
  database_net:
    internal: true

volumes:
  postgres_data:
  redis_data:

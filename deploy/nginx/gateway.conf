upstream ftth_backend {
    least_conn;
    server ftth-app-1:8080 max_fails=3 fail_timeout=10s;
    server ftth-app-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /estado {
        return 301 /estado/;
    }

    # Segundo proyecto estático, aislado del backend FTTH.
    location ^~ /estado/ {
        proxy_pass http://static-site:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NGINX distribuye las peticiones entre las dos réplicas Go.
    location / {
        proxy_pass http://ftth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
